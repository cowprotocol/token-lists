name: Generate Auxiliary Lists

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    name: Generate auxiliary token lists
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          authToken: ${{ secrets.PACKAGE_READ_AUTH_TOKEN }}

      - name: Generate auxiliary lists
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: yarn generateAuxLists

      - name: Upload generated lists
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aux-lists
          path: |
            src/public/CoinGecko.*.json
            src/public/Uniswap.*.json
            src/public/TokenSupply.*.json
          retention-days: 1

  commit:
    name: Commit auxiliary token lists
    needs: generate
    runs-on: ubuntu-latest
    environment: token-lists-bot
    permissions: {}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.COW_FE_TOKEN_LIST_UPDATER_APP_ID }}
          private-key: ${{ secrets.COW_FE_TOKEN_LIST_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Download generated lists
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: aux-lists
          path: src/public/

      - name: Commit changes through the API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: "chore: automated auxiliary lists generation"
        run: |
          head="$GITHUB_SHA"
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)
          tree=$(for f in src/public/*.json; do
              jq -n --arg path "$f" --rawfile content "$f" '{path: $path, mode: "100644", type: "blob", content: $content}'
            done | jq -s --arg base "$base_tree" '{base_tree: $base, tree: .}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          if [ "$tree" = "$base_tree" ]; then
            echo "No changes to commit"
            exit 0
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" -f message="$MESSAGE" -f tree="$tree" -f "parents[]=$head" --jq .sha)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=false

  report-failure:
    name: Report failure
    needs: [generate, commit]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create issue on failure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auxiliary Lists Generation Failed',
              body: `The workflow to generate auxiliary token lists failed on ${new Date().toISOString()}.

              Please check the workflow logs for more details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
